#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "geoquest"
name = "GeoQuest"
description.en = "Geography game"
description.fr = "Jeu de géographie"

version = "1.0~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "GPL-3.0"
demo = "https://geoquest.gg/"
code = "https://github.com/woutdp/geoquest"
fund = "https://buymeacoffee.com/woutdp"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/geoquest"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

        [resources.sources.main]
        # This is not used as we are using git clone. It's only here for autoupdate.
        url = "https://github.com/woutdp/geoquest/archive/ed107dec066e56081feff36a2adc222b53ad9a25.tar.gz"
        sha256 = "e2ac2c09b40ed436d4c151606eb609db01ad0000ddfce0fc399ac1dbc7185a8d"
        prefetch = false
        autoupdate.strategy = "latest_github_commit"

        [resources.sources.ynh_build]
        url = "https://github.com/Yunohost-Apps/geoquest_ynh/releases/download/v1.0-ed107dec/geoquest_v1.0-ed107dec_ynh.zip"
        sha256 = "adf6554e036224807a4b7958f73cb27c11e1aca2ab1ef9fc6f4e16f813005e83"
        format = "zip"
        extract = true
        in_subdir = true


    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 4173
